<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11月讀經打卡</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { background-color: #fbf9f4; border-radius: 8px; padding: 20px; width: 100%; max-width: 600px; border: 1px solid #e0dcd3; }
        h1 { font-size: 20px; text-align: center; color: #2c3e50; margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 14px; color: #7f8c8d; margin-bottom: 20px; }
        .date-picker { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #dcdcdc; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        .progress-container { background-color: #e0e0e0; border-radius: 10px; height: 20px; margin-bottom: 10px; overflow: hidden; }
        .progress-bar { height: 100%; background-color: #27ae60; width: 0%; }
        .progress-text { text-align: right; font-size: 14px; color: #555; margin-bottom: 20px; font-weight: bold; }
        .daily-card { background-color: #fbf9f4; border: 1px solid #8c867c; border-radius: 4px; padding: 20px; }
        .day-title { font-size: 22px; margin-bottom: 15px; display: flex; align-items: baseline; }
        .day-num { font-size: 32px; font-weight: bold; margin-right: 10px; }
        .check-item { display: flex; align-items: center; padding: 18px 0; border-bottom: 1px dashed #dcdcdc; }
        .check-item:last-child { border-bottom: none; }
        .item-label { width: 60px; height: 30px; line-height: 30px; text-align: center; border: 1px solid #dcdcdc; color: #7a756d; font-size: 14px; margin-right: 15px; background-color: #f5f3ec; flex-shrink: 0; }
        .check-item input[type="checkbox"] { width: 24px; height: 24px; margin-right: 15px; cursor: pointer; flex-shrink: 0; }
        .item-text { font-size: 18px; color: #333; text-decoration: none; border-bottom: 1px solid #c0c0c0; padding-bottom: 2px; flex-grow: 1; display: flex; justify-content: space-between; }
        .item-text::after { content: '↗'; color: #888; margin-left: 10px; }
        .completed .item-text { color: #bdc3c7; border-bottom-color: #bdc3c7; text-decoration: line-through; }
    </style>
</head>
<body>
<div class="container">
    <h1>享受神的奧秘</h1>
    <div class="subtitle">早上親主team讀經表 (11/2026)</div>
    <input type="date" id="datePicker" class="date-picker">
    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-text" id="progressText">本月進度：0% (0/90)</div>
    <div class="daily-card">
        <div class="day-title" id="dayTitle"></div>
        <div id="itemsContainer"></div>
    </div>
</div>
<script>
    // 已經將所有經卷轉換為標準名稱及阿拉伯數字 (mL, pL, fL 係專畀 Gateway 用嘅)
    var schedule = {
        1: { m: "太十六 13-18", p: "詩 126", f: "撒下 13-14", mL: "馬太福音 16:13-18", pL: "詩篇 126", fL: "撒母耳記下 13-14" },
        2: { m: "約十六 12-14", p: "詩 127", f: "撒下 15-16", mL: "約翰福音 16:12-14", pL: "詩篇 127", fL: "撒母耳記下 15-16" },
        3: { m: "西二 1-3", p: "詩 128", f: "撒下 17-18", mL: "歌羅西書 2:1-3", pL: "詩篇 128", fL: "撒母耳記下 17-18" },
        4: { m: "西二 4-7", p: "詩 129", f: "撒下 19-20", mL: "歌羅西書 2:4-7", pL: "詩篇 129", fL: "撒母耳記下 19-20" },
        5: { m: "西二 8-12", p: "詩 130", f: "撒下 21-22", mL: "歌羅西書 2:8-12", pL: "詩篇 130", fL: "撒母耳記下 21-22" },
        6: { m: "林前二 1-5", p: "詩 131", f: "撒下 23-24", mL: "哥林多前書 2:1-5", pL: "詩篇 131", fL: "撒母耳記下 23-24" },
        7: { m: "林前二 7-10", p: "詩 132", f: "王上 1-2", mL: "哥林多前書 2:7-10", pL: "詩篇 132", fL: "列王紀上 1-2" },
        8: { m: "林前一 18-21", p: "詩 133", f: "王上 3-4", mL: "哥林多前書 1:18-21", pL: "詩篇 133", fL: "列王紀上 3-4" },
        9: { m: "林前一 22-25", p: "詩 134", f: "王上 5-6", mL: "哥林多前書 1:22-25", pL: "詩篇 134", fL: "列王紀上 5-6" },
        10: { m: "林後四 3-6", p: "詩 135", f: "王上 7-8", mL: "哥林多後書 4:3-6", pL: "詩篇 135", fL: "列王紀上 7-8" },
        11: { m: "西一 24-27", p: "詩 136", f: "王上 9-10", mL: "歌羅西書 1:24-27", pL: "詩篇 136", fL: "列王紀上 9-10" },
        12: { m: "弗三 2-6", p: "詩 137", f: "王上 11-12", mL: "以弗所書 3:2-6", pL: "詩篇 137", fL: "列王紀上 11-12" },
        13: { m: "弗三 7-9", p: "詩 138", f: "王上 13-14", mL: "以弗所書 3:7-9", pL: "詩篇 138", fL: "列王紀上 13-14" },
        14: { m: "弗三 10-13", p: "詩 139", f: "王上 15-16", mL: "以弗所書 3:10-13", pL: "詩篇 139", fL: "列王紀上 15-16" },
        15: { m: "弗五 25-27", p: "詩 140", f: "王上 17-18", mL: "以弗所書 5:25-27", pL: "詩篇 140", fL: "列王紀上 17-18" },
        16: { m: "弗五 28-32", p: "詩 141", f: "王上 19-20", mL: "以弗所書 5:28-32", pL: "詩篇 141", fL: "列王紀上 19-20" },
        17: { m: "提前三 15", p: "詩 142", f: "王上 21-22", mL: "提摩太前書 3:15", pL: "詩篇 142", fL: "列王紀上 21-22" },
        18: { m: "提前三 16", p: "詩 143", f: "王下 1-2", mL: "提摩太前書 3:16", pL: "詩篇 143", fL: "列王紀下 1-2" },
        19: { m: "弗六 18-20", p: "詩 144", f: "王下 3-4", mL: "以弗所書 6:18-20", pL: "詩篇 144", fL: "列王紀下 3-4" },
        20: { m: "西四 2-4", p: "詩 145", f: "王下 5-6", mL: "歌羅西書 4:2-4", pL: "詩篇 145", fL: "列王紀下 5-6" },
        21: { m: "羅十六 25-27", p: "詩 146", f: "王下 7-8", mL: "羅馬書 16:25-27", pL: "詩篇 146", fL: "列王紀下 7-8" },
        22: { m: "林前十五 50-54", p: "詩 147", f: "王下 9-10", mL: "哥林多前書 15:50-54", pL: "詩篇 147", fL: "列王紀下 9-10" },
        23: { m: "太廿二 41-46", p: "詩 148", f: "王下 11-12", mL: "馬太福音 22:41-46", pL: "詩篇 148", fL: "列王紀下 11-12" },
        24: { m: "來二 5-9", p: "詩 149", f: "王下 13-14", mL: "希伯來書 2:5-9", pL: "詩篇 149", fL: "列王紀下 13-14" },
        25: { m: "來二 14-15", p: "詩 150", f: "王下 15-16", mL: "希伯來書 2:14-15", pL: "詩篇 150", fL: "列王紀下 15-16" },
        26: { m: "腓二 5-8", p: "詩 1", f: "王下 17-18", mL: "腓立比書 2:5-8", pL: "詩篇 1", fL: "列王紀下 17-18" },
        27: { m: "腓二 9-11", p: "詩 2", f: "王下 19-20", mL: "腓立比書 2:9-11", pL: "詩篇 2", fL: "列王紀下 19-20" },
        28: { m: "腓三 8-9", p: "詩 3", f: "王下 21-22", mL: "腓立比書 3:8-9", pL: "詩篇 3", fL: "列王紀下 21-22" },
        29: { m: "腓三 10-12", p: "詩 4", f: "王下 23-24", mL: "腓立比書 3:10-12", pL: "詩篇 4", fL: "列王紀下 23-24" },
        30: { m: "西一 9-11", p: "詩 5", f: "王下 25", mL: "歌羅西書 1:9-11", pL: "詩篇 5", fL: "列王紀下 25" }
    };

    function getUrl(searchStr) {
        return "https://www.biblegateway.com/passage/?search=" + encodeURIComponent(searchStr) + "&version=CUV&interface=print";
    }

    function getKey(dateStr, type) { return 'bible_v4_' + dateStr + '_' + type; }

    function updateProgress(year, month) {
        var total = 90, done = 0;
        for(var i=1; i<=30; i++) {
            var d = i < 10 ? '0'+i : i;
            var m = month < 10 ? '0'+month : month;
            var str = year+'-'+m+'-'+d;
            ['m','p','f'].forEach(function(t){
                if(localStorage.getItem(getKey(str, t)) === 'true') done++;
            });
        }
        var pct = Math.round((done/total)*100);
        document.getElementById('progressBar').style.width = pct + '%';
        document.getElementById('progressText').innerText = '本月進度：' + pct + '% (' + done + '/90)';
    }

    function createItem(dateStr, type, label, text, searchStr) {
        var isChecked = localStorage.getItem(getKey(dateStr, type)) === 'true';
        var div = document.createElement('div');
        div.className = 'check-item' + (isChecked ? ' completed' : '');
        
        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = isChecked;
        cb.onchange = function(e) {
            if(e.target.checked) {
                localStorage.setItem(getKey(dateStr, type), 'true');
                div.classList.add('completed');
            } else {
                localStorage.removeItem(getKey(dateStr, type));
                div.classList.remove('completed');
            }
            var p = dateStr.split('-');
            updateProgress(parseInt(p[0]), parseInt(p[1]));
        };

        var lbl = document.createElement('div');
        lbl.className = 'item-label';
        lbl.innerText = label;

        var a = document.createElement('a');
        a.className = 'item-text';
        a.target = '_blank';
        a.innerText = text;
        a.href = getUrl(searchStr);

        div.appendChild(lbl);
        div.appendChild(cb);
        div.appendChild(a);
        return div;
    }

    function loadDay(dateStr) {
        if(!dateStr) return;
        var parts = dateStr.split('-');
        var y = parseInt(parts[0]), m = parseInt(parts[1]), d = parseInt(parts[2]);
        
        if(d > 30) {
            document.getElementById('dayTitle').innerText = "11月只有30天";
            document.getElementById('itemsContainer').innerHTML = "";
            return;
        }

        var days = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
        var dt = new Date(y, m-1, d);
        document.getElementById('dayTitle').innerHTML = '<span class="day-num">' + d + '</span><span class="day-week">' + days[dt.getDay()] + '</span>';

        var data = schedule[d];
        if(data) {
            var box = document.getElementById('itemsContainer');
            box.innerHTML = '';
            box.appendChild(createItem(dateStr, 'm', '默想', data.m, data.mL));
            box.appendChild(createItem(dateStr, 'p', '詩篇', data.p, data.pL));
            box.appendChild(createItem(dateStr, 'f', '快讀', data.f, data.fL));
        }
        updateProgress(y, m);
    }

    window.onload = function() {
        var today = new Date();
        var y = today.getFullYear();
        var m = today.getMonth() + 1;
        var d = today.getDate();

        if (m !== 11) {
            m = 11;
            d = 1;
        }

        var mStr = m.toString().padStart(2, '0');
        var dStr = d.toString().padStart(2, '0');
        var initDate = y + '-' + mStr + '-' + dStr;
        
        var picker = document.getElementById('datePicker');
        picker.value = initDate;
        loadDay(initDate);
        
        picker.onchange = function(e) {
            loadDay(e.target.value);
        };
    };
</script>
</body>
</html>
