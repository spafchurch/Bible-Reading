        }
        .date-picker {

        .progress-bar {

        .progress-text {

        .daily-card {

        .day-title {

            font-weight: bold;
            color: #2980b9;
            margin-bottom: 15px;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }
        .theme-tag {
            font-size: 13px;
            background-color: #e67e22;
            color: #fff;
            padding: 3px 10px;
            border-radius: 20px;
            margin-left: 10px;
            font-weight: bold;
            box-shadow: 0 2px 4px rgba(230, 126, 34, 0.3);
        }
        
        .check-item {
            display: flex;
            align-items: flex-start;
            padding: 12px 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            background-color: #fff;
            border: 1px solid #eee;
            transition: background-color 0.2s;
        }
        .check-item.completed {
            background-color: #f0f0f0;
            opacity: 0.7;
        }
        .check-item.completed .item-text {
            text-decoration: line-through;
            color: #999;
        }
        
        .check-item input[type="checkbox"] {
            width: 22px;
            height: 22px;
            margin-right: 12px;
            margin-top: 2px;
            cursor: pointer;
            flex-shrink: 0;
        }
        
        .item-content {
            flex-grow: 1;
        }
        .item-text {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 5px;
        }
        .item-label {
            font-size: 12px;
            color: #888;
            font-weight: bold;
            margin-bottom: 2px;
        }
        
        .gateway-btn {
            display: inline-block;
            padding: 6px 10px;
            background-color: #e8f8f5;
            color: #16a085;
            border: 1px solid #16a085;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            margin-top: 5px;
        }
        .gateway-btn:active {
            background-color: #16a085;
            color: #fff;
        }

        .song-link {
            display: inline-block;
            padding: 6px 10px;
            background-color: #fdf2e9;
            color: #d35400;
            border: 1px solid #e67e22;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            margin-top: 5px;
        }
        .song-link:active {
            background-color: #e67e22;
            color: #fff;
        }

        .song-text {
            color: #c0392b;
            font-weight: bold;
        }
    </style>

    const datePicker = document.getElementById('datePicker');
    const dayTitle = document.getElementById('dayTitle');
    const versesContainer = document.getElementById('versesContainer');
    const songContainer = document.getElementById('songContainer');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');

    // 自動獲取當天日期
    const today = new Date();
    const currentYear = today.getFullYear();
    const currentMonth = String(today.getMonth() + 1).padStart(2, '0');
    const currentDay = String(today.getDate()).padStart(2, '0');
    datePicker.value = `${currentYear}-${currentMonth}-${currentDay}`;

    function getStorageKey(dateStr, type) {
        return 'bible_record_' + dateStr + '_' + type;
    }

    function updateProgress(year, month) {
        let completedCount = 0;
        const daysInMonth = new Date(year, month, 0).getDate();
        const totalDays = Math.min(daysInMonth, 30); // 11月只有30天
        const totalItems = totalDays * 4; // 每日4個項目 (3段經文 + 1首詩歌)

        for (let i = 1; i <= totalDays; i++) {
            const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
            // 檢查3段經文
            for (let j = 1; j <= 3; j++) {
                if (localStorage.getItem(getStorageKey(dateStr, 'verse' + j)) === 'true') {
                    completedCount++;
                }
            }
            // 檢查詩歌
            if (localStorage.getItem(getStorageKey(dateStr, 'song')) === 'true') {
                completedCount++;
            }
        }

        const percentage = Math.round((completedCount / totalItems) * 100);
        progressBar.style.width = percentage + '%';
        progressText.innerText = `本月進度：${percentage}% (${completedCount}/${totalItems})`;
    }

    function createCheckItem(dateStr, type, label, text, extraHtml = '') {
        const isChecked = localStorage.getItem(getStorageKey(dateStr, type)) === 'true';
        const itemDiv = document.createElement('div');
        itemDiv.className = 'check-item' + (isChecked ? ' completed' : '');
        
        itemDiv.innerHTML = `
            <input type="checkbox" id="chk_${type}" ${isChecked ? 'checked' : ''}>
            <div class="item-content">
                <div class="item-label">${label}</div>
                <div class="item-text">${text}</div>
                ${extraHtml}
            </div>
        `;
        
        const checkbox = itemDiv.querySelector('input');
        checkbox.addEventListener('change', (e) => {
            if (e.target.checked) {
                localStorage.setItem(getStorageKey(dateStr, type), 'true');
                itemDiv.classList.add('completed');
            } else {
                localStorage.removeItem(getStorageKey(dateStr, type));
                itemDiv.classList.remove('completed');
            }
            const dateObj = new Date(dateStr);
            updateProgress(dateObj.getFullYear(), dateObj.getMonth() + 1);
        });
        
        return itemDiv;
    }

    function loadDayData(dateStr) {
        const dateObj = new Date(dateStr);
        const day = dateObj.getDate();
        const year = dateObj.getFullYear();
        const month = dateObj.getMonth() + 1;

        if (day > 30) return; // 11月最多30日

        const data = schedule[day];
        if (data) {
            // 設定標題
            const themeHtml = data.group ? `<span class="theme-tag">${data.group}</span>` : '';
            dayTitle.innerHTML = `第 ${day} 日 ${themeHtml}`;
            
            // 清空容器
            versesContainer.innerHTML = '';
            songContainer.innerHTML = '';

            // 1. 加入 Gateway Bible 總按鈕
            const gatewayBtn = document.createElement('a');
            gatewayBtn.href = data.url;
            gatewayBtn.target = '_blank';
            gatewayBtn.className = 'gateway-btn';
            gatewayBtn.style.width = '100%';
            gatewayBtn.style.textAlign = 'center';
            gatewayBtn.style.marginBottom = '15px';
            gatewayBtn.innerHTML = '📖 一次過打開今日所有經文 (Gateway Bible)';
            versesContainer.appendChild(gatewayBtn);

            // 2. 加入三段經文打勾
            const verseLabels = ["第一段經文", "第二段經文", "第三段經文"];
            data.verses.forEach((verse, index) => {
                const type = 'verse' + (index + 1);
                const item = createCheckItem(dateStr, type, verseLabels[index], verse);
                versesContainer.appendChild(item);
            });

            // 3. 加入詩歌打勾
            const songSearchUrl = `https://churchofgod.org.hk/hymns/?s=${encodeURIComponent(data.song)}`;
            const songExtra = `<a href="${songSearchUrl}" target="_blank" class="song-link">🎵 前往教會網站搜尋此詩歌</a>`;
            const songItem = createCheckItem(dateStr, 'song', '第四項：詩歌', `<span class="song-text">${data.song}</span>`, songExtra);
            songContainer.appendChild(songItem);
        }

        updateProgress(year, month);
    }

    datePicker.addEventListener('change', (e) => {
        loadDayData(e.target.value);
    });

    // 首次載入
    loadDayData(datePicker.value);

</script>
